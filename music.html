<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>У камина играет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Cormorant+SC:wght@500&display=swap" rel="stylesheet">
<script>
  /* ===== Плейлист: чтобы поменять, вставь сюда id из ссылки (всё после list=) ===== */
  window.PLAYLIST_ID = "PLmjfxT8fCoLhmXEO5vFjJOODT5XwkhvQR";
  window.PLAYLIST_AUTHOR = "Malte Marten";
</script>
<style>
  :root{
    --bg:#191919;
    --card:#1e211d;
    --card2:#171a16;
    --ink:#ecdfc8;
    --muted:#9c907c;
    --gold:#e2b26e;
    --gold-soft:rgba(226,178,110,.16);
    --line:rgba(226,178,110,.32);
    --moss:#5f7d4f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;
    display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
  .card{
    position:relative;width:100%;max-width:760px;
    background:linear-gradient(160deg,var(--card),var(--card2));
    border:1px solid var(--line);border-radius:18px;
    padding:16px;display:grid;gap:16px;
    grid-template-columns:1fr;
    box-shadow:0 18px 40px -22px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,240,210,.04);
  }
  @media (min-width:520px){ .card{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;padding:18px} }
  .screen{
    position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#0d0f0c;
    box-shadow:0 0 0 1px var(--line);
  }
  .screen iframe,#yt{position:absolute;inset:0;width:100%;height:100%;border:0}
  .screen::after{ /* тёплая виньетка поверх края, не мешает смотреть */
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:12px;
    box-shadow:inset 0 0 30px rgba(20,12,4,.55);
  }
  .info{display:flex;flex-direction:column;gap:10px;min-width:0}
  .label{display:flex;align-items:center;gap:8px;font-family:"Cormorant SC",Georgia,serif;
    letter-spacing:.2em;font-size:13px;color:var(--gold)}
  .eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
  .eq i{width:2px;background:var(--gold);height:3px;border-radius:1px}
  .playing .eq i{animation:eq 1s ease-in-out infinite}
  .playing .eq i:nth-child(2){animation-delay:-.4s}
  .playing .eq i:nth-child(3){animation-delay:-.7s}
  @keyframes eq{0%,100%{height:3px}50%{height:11px}}
  .title{font-size:21px;line-height:1.15;font-weight:500;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:1.15em}
  .sub{font-size:14px;color:var(--muted);font-style:italic}
  .bar{position:relative;height:14px;cursor:pointer;display:flex;align-items:center}
  .bar .track{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:rgba(236,223,200,.12)}
  .bar .fill{position:absolute;left:0;height:3px;border-radius:2px;background:var(--gold);width:0}
  .bar .knob{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--gold);
    transform:translateX(-50%);left:0;box-shadow:0 0 8px rgba(226,178,110,.6);opacity:0;transition:opacity .2s}
  .bar:hover .knob{opacity:1}
  .times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
    font-variant-numeric:tabular-nums;margin-top:-4px}
  .ctrls{display:flex;align-items:center;gap:6px}
  button{all:unset;cursor:pointer;display:grid;place-items:center;border-radius:50%;
    width:36px;height:36px;color:var(--ink);transition:background .2s,color .2s,transform .1s}
  button:hover{background:var(--gold-soft);color:var(--gold)}
  button:active{transform:scale(.94)}
  button:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
  button.on{color:var(--gold)}
  button.main{width:48px;height:48px;background:var(--gold);color:#1b1610}
  button.main:hover{background:#efc486;color:#1b1610}
  svg{width:18px;height:18px;fill:currentColor}
  button.main svg{width:22px;height:22px}
  .vol{display:flex;align-items:center;gap:4px;margin-left:auto}
  input[type=range]{-webkit-appearance:none;appearance:none;width:70px;height:3px;border-radius:2px;
    background:rgba(236,223,200,.15);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--gold);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:var(--gold);cursor:pointer}
  .fallback{position:absolute;inset:0;border-radius:18px;background:rgba(23,26,22,.96);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
  .fallback.show{display:flex}
  .fallback p{max-width:36ch;font-size:16px;color:var(--ink)}
  .fallback small{color:var(--muted);font-size:13px}
  .fallback a{color:#1b1610;background:var(--gold);padding:8px 16px;border-radius:999px;text-decoration:none;
    font-family:"Cormorant SC",Georgia,serif;letter-spacing:.12em;font-size:14px}
  @media (prefers-reduced-motion: reduce){ .playing .eq i{animation:none;height:8px} }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="screen"><div id="yt"></div></div>
  <div class="info">
    <div class="label"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>у камина играет</div>
    <div class="title" id="title">Разжигаю камин…</div>
    <div class="sub" id="sub"></div>
    <div>
      <div class="bar" id="bar" aria-label="Перемотка"><div class="track"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="ctrls">
      <button id="shuf" title="Перемешать" aria-label="Перемешать"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-3.1 4 3.1 4H17v-3l4 4-4 4v-3h-3.6l-3.9-5-3.9 5H3v-2h3.6l3.1-4-3.1-4H3V6h3.6l3.9 5 3.9-5H17z"/></svg></button>
      <button id="prev" title="Предыдущий" aria-label="Предыдущий"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="play" class="main" title="Играть" aria-label="Играть"><svg viewBox="0 0 24 24" id="playIco"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="next" title="Следующий" aria-label="Следующий"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg></button>
      <div class="vol">
        <button id="mute" title="Без звука" aria-label="Без звука"><svg viewBox="0 0 24 24" id="volIco"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
        <input type="range" id="vol" min="0" max="100" value="55" aria-label="Громкость">
      </div>
    </div>
  </div>
  <div class="fallback" id="fb">
    <p>YouTube не захотел играть внутри этой рамки.</p>
    <a id="fbLink" target="_blank" rel="noopener">открыть плейлист</a>
    <small>Можно вставить ссылку на плейлист в Notion обычным встраиванием, так он заиграет точно.</small>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const ID=window.PLAYLIST_ID, AUTHOR=window.PLAYLIST_AUTHOR||'';
  $('fbLink').href='https://www.youtube.com/playlist?list='+ID;
  const PLAY='<path d="M8 5v14l11-7z"/>', PAUSE='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  const VOL='<path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/>';
  const MUTE='<path d="M4 9v6h4l5 4V5L8 9H4zm15.6 3 2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4z"/>';
  let p=null, ready=false, shuffle=false, dragging=false;
  const fmt=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`};
  const fail=()=>$('fb').classList.add('show');

  const t0=setTimeout(()=>{ if(!ready) fail(); }, 12000);

  window.onYouTubeIframeAPIReady=function(){
    const vars={listType:'playlist',list:ID,controls:0,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3,disablekb:1};
    if(/^https?:/.test(location.origin)) vars.origin=location.origin;
    p=new YT.Player('yt',{width:'100%',height:'100%',playerVars:vars,
      events:{
        onReady:()=>{ready=true;clearTimeout(t0);p.setVolume(+$('vol').value);meta();},
        onStateChange:e=>{
          const playing=e.data===YT.PlayerState.PLAYING;
          $('card').classList.toggle('playing',playing);
          $('playIco').innerHTML=playing?PAUSE:PLAY;
          $('play').title=playing?'Пауза':'Играть';
          meta();
        },
        onError:e=>{ if([2,5,100].includes(e.data)) { p.nextVideo(); } else fail(); }
      }});
  };
  const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api';
  s.onerror=fail; document.head.appendChild(s);

  function meta(){
    if(!p||!p.getVideoData) return;
    const d=p.getVideoData()||{};
    if(d.title) $('title').textContent=d.title;
    const list=p.getPlaylist&&p.getPlaylist(), i=p.getPlaylistIndex&&p.getPlaylistIndex();
    const n=list&&list.length?` · ${i+1} из ${list.length}`:'';
    $('sub').textContent=(AUTHOR||d.author||'')+n;
  }
  setInterval(()=>{
    if(!ready||dragging) return;
    const c=p.getCurrentTime(), d=p.getDuration(); const f=d?c/d*100:0;
    $('fill').style.width=f+'%'; $('knob').style.left=f+'%';
    $('cur').textContent=fmt(c); $('dur').textContent=fmt(d);
  },500);

  $('play').onclick=()=>{ if(!ready) return; p.getPlayerState()===1?p.pauseVideo():p.playVideo(); };
  $('next').onclick=()=>ready&&p.nextVideo();
  $('prev').onclick=()=>ready&&p.previousVideo();
  $('shuf').onclick=()=>{ if(!ready) return; shuffle=!shuffle; p.setShuffle(shuffle); $('shuf').classList.toggle('on',shuffle); if(shuffle){p.playVideoAt(0);} };
  $('vol').oninput=e=>{ if(!ready) return; p.unMute(); p.setVolume(+e.target.value); $('volIco').innerHTML=+e.target.value?VOL:MUTE; };
  $('mute').onclick=()=>{ if(!ready) return; if(p.isMuted()){p.unMute();$('volIco').innerHTML=VOL;} else {p.mute();$('volIco').innerHTML=MUTE;} };
  const seek=e=>{ if(!ready) return; const r=$('bar').getBoundingClientRect(); const f=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    $('fill').style.width=f*100+'%'; $('knob').style.left=f*100+'%'; return f; };
  $('bar').addEventListener('pointerdown',e=>{dragging=true;$('bar').setPointerCapture(e.pointerId);seek(e);});
  $('bar').addEventListener('pointermove',e=>{ if(dragging) seek(e); });
  $('bar').addEventListener('pointerup',e=>{ const f=seek(e); dragging=false; if(ready&&f!=null) p.seekTo(f*p.getDuration(),true); });
})();
</script>
</body>
</html>
